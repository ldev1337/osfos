[package]
name = "osfos-net"
version = "0.1.0"
edition = "2021"

[lib]
name = "osfos_net"
crate-type = ["staticlib"]

[dependencies]
smoltcp = { version = "=0.14.0", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-dhcpv4",
    "socket-icmp",
    "socket-tcp",
    "socket-udp",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0