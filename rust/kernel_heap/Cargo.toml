[package]
name = "kernel_heap"
version = "0.1.0"
edition = "2021"

[lib]
name = "kernel_heap"
crate-type = ["staticlib"]

[profile.release]
opt-level = "z"          # Optimize strictly for size
lto = "fat"              # Aggressive Link-Time Optimization across boundaries
codegen-units = 1        # Maximize optimization efficiency
panic = "abort"          # Eliminate stack-unwinding bloat
strip = true             # Strip symbols from release archive